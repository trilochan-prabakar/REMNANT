scenario:
  schema_version: 1
  id: stale-authorization-replay
  name: Stale authorization replay
  description: Grant, prime, revoke, compare direct origin and normal proxy replay.

steps:
  - type: control
    name: grant-alice
    operation: grant
    via: origin
    principal: alice

  - name: prime-cache
    via: proxy
    method: GET
    path: /protected/report?principal=alice
    expect_status: 200
    expect_cache_state: miss
    expect_body_contains: alice-private-report

  - type: control
    name: revoke-alice
    operation: revoke
    via: origin
    principal: alice

  - name: origin-denies
    via: origin
    method: GET
    path: /protected/report?principal=alice
    expect_status: 403

  - name: proxy-replays
    via: proxy
    method: GET
    path: /protected/report?principal=alice
    expect_status: 200
    expect_cache_state: hit
    expect_body_contains: alice-private-report

  - type: control
    name: purge-proxy-object
    operation: purge
    via: proxy
    path: /protected/report?principal=alice
    expect_status: 200

  - name: origin-denial-after-purge
    via: proxy
    method: GET
    path: /protected/report?principal=alice
    expect_status: 403
