proxy_cache_path /var/cache/nginx/remnant levels=1:2 keys_zone=remnant_cache:10m max_size=20m inactive=2m use_temp_path=off;

server {
    listen 8080;

    location = /health {
        proxy_pass http://nginx-origin:8000/health;
    }

    location = /protected/report {
        proxy_cache remnant_cache;
        proxy_cache_key "$scheme|$proxy_host|$request_uri";
        proxy_cache_valid 200 60s;
        proxy_cache_methods GET HEAD;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://nginx-origin:8000;
    }
}
