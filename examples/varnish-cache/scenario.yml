scenario:
  schema_version: 1
  id: varnish-stale-auth-and-identity-isolation
  name: Varnish stale authorization and cross-identity isolation
  description: Exercise real Varnish cache replay, identity collision, and PURGE invalidation.

steps:
  - type: control
    name: grant-alice
    operation: grant
    via: origin
    principal: alice

  - type: control
    name: ensure-bob-denied
    operation: revoke
    via: origin
    principal: bob

  - name: prime-alice-cache
    via: proxy
    method: GET
    path: /protected/report?principal=alice
    expect_status: 200
    expect_cache_state: miss
    expect_body_contains: alice-private-report

  - type: control
    name: revoke-alice
    operation: revoke
    via: origin
    principal: alice

  - name: direct-origin-denies-alice
    via: origin
    method: GET
    path: /protected/report?principal=alice
    expect_status: 403

  - name: varnish-replays-alice-cache
    via: proxy
    method: GET
    path: /protected/report?principal=alice
    expect_status: 200
    expect_cache_state: hit
    expect_body_contains: alice-private-report

  - name: direct-origin-denies-bob
    via: origin
    method: GET
    path: /protected/report?principal=bob
    expect_status: 403

  - name: varnish-cross-identity-cache-collision
    via: proxy
    method: GET
    path: /protected/report?principal=bob
    expect_status: 200
    expect_cache_state: hit
    expect_body_contains: alice-private-report

  - type: control
    name: purge-colliding-cache-object
    operation: purge
    via: proxy
    path: /protected/report?principal=bob
    expect_status: 200

  - name: bob-denied-after-purge
    via: proxy
    method: GET
    path: /protected/report?principal=bob
    expect_status: 403
