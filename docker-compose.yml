services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - remnant_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  demo:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports
    restart: "no"

  nginx-origin:
    build:
      context: ./examples/nginx-cache
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx-cache:
    image: nginx:1.27-alpine
    depends_on:
      nginx-origin:
        condition: service_healthy
    volumes:
      - ./examples/nginx-cache/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx-check:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "examples/nginx-cache/check.py"]
    depends_on:
      nginx-cache:
        condition: service_healthy
    restart: "no"

volumes:
  remnant_redis_data:
