name: REMNANT V3 Tests

on:
  push:
    branches: [main, v3-development]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  v3-tests:
    name: Python 3.12 V3 unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run V1, V2, and V3 regression suite
        run: python -m pytest -q
      - name: Compile V3 modules
        run: python -m compileall -q src/remnant/v3

  varnish-integration:
    name: Real Varnish 7.6 integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated Varnish authorization replay and identity collision checks
        run: |
          docker compose -f examples/varnish-cache/docker-compose.yml up --build --abort-on-container-exit --exit-code-from check
      - name: Stop Varnish fixture
        if: always()
        run: docker compose -f examples/varnish-cache/docker-compose.yml down -v
