name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Python 3.12 / Redis 7 / Nginx proxy_cache
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Python test suite
        run: python -m pytest -q

      - name: Run Docker Compose demo
        run: docker compose run --build --rm demo

      - name: Test real Nginx proxy_cache target
        run: docker compose run --build --rm nginx-check

      - name: Stop Compose services
        if: always()
        run: docker compose down -v
